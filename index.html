<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hola 🌷</title>
<style>
*{box-sizing:border-box}body{
  margin:0;min-height:100vh;display:grid;place-items:center;
  font-family:Arial,sans-serif;color:#3d3035;overflow:hidden;
  background:linear-gradient(135deg,#fff7f8,#f8edf1)
}
body:before,body:after{
  content:"🌸 🦋 🌷 🦋 🌸";position:absolute;font-size:28px;
  opacity:.45;animation:float 8s ease-in-out infinite
}
body:before{top:8%;left:-5%}body:after{bottom:8%;right:-5%;animation-delay:-4s}
@keyframes float{50%{transform:translateY(-25px) translateX(30px)}}
.card{
  width:min(90%,380px);padding:32px 25px;border-radius:28px;
  background:#ffffffbb;backdrop-filter:blur(10px);
  box-shadow:0 20px 60px #d9aab855;text-align:center
}
.flower{font-size:42px;margin-bottom:12px}
p{font-size:19px;line-height:1.5;margin:14px 0}
input{
  width:100%;border:0;border-bottom:1px solid #d9b8c1;
  background:transparent;padding:12px;font-size:16px;outline:none;text-align:center
}
button{
  margin-top:16px;border:0;border-radius:30px;padding:11px 24px;
  background:#e8a9ba;color:white;font-size:15px;cursor:pointer
}
.hidden{display:none}
</style>
</head>
<body>
<main class="card">
  <div class="flower">🌷</div>

  <div id="one">
    <p>Hola 👋</p>
    <input id="hello" placeholder="Responde algo...">
    <button onclick="next(1)">Enviar</button>
  </div>

  <div id="two" class="hidden">
    <p id="reply"></p>
    <p>¿Qué haces? 👀</p>
    <input id="doing" placeholder="Por ejemplo: nada">
    <button onclick="next(2)">Enviar</button>
  </div>

  <div id="three" class="hidden">
    <p id="final"></p>
  </div>
</main>

<script>
function next(n){
  if(n==1){
    let x=hello.value||"Hola";
    reply.textContent=x+" 😊";
    one.classList.add("hidden");
    two.classList.remove("hidden");
  }else{
    let x=doing.value.trim().toLowerCase();
    final.innerHTML=x.includes("nada")
      ?"Entonces estamos igual... yo también estoy aburrido 😌<br><br>Podríamos arreglar eso 👀"
      :"Suena interesante 👀<br><br>Yo estoy aburrido, así que claramente necesito que me cuentes más 😌";
    two.classList.add("hidden");
    three.classList.remove("hidden");
  }
}
</script>
</body>
</html>
