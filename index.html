<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hola</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  overflow:hidden;
  font-family:Georgia,serif;
  color:#49383e;
  background:
    radial-gradient(circle at 10% 10%,#ffe8ef,transparent 25%),
    radial-gradient(circle at 90% 90%,#f6ead8,transparent 30%),
    #fff9f7;
}

/* FLORES */

.flower{
  position:fixed;
  pointer-events:none;
  opacity:.55;
  animation:float 7s ease-in-out infinite;
}

.f1{top:7%;left:8%;font-size:42px}
.f2{top:15%;right:9%;font-size:34px;animation-delay:-2s}
.f3{bottom:8%;left:10%;font-size:38px;animation-delay:-4s}
.f4{bottom:10%;right:8%;font-size:46px;animation-delay:-1s}

@keyframes float{
  50%{
    transform:translateY(-18px) rotate(5deg);
  }
}


/* CARTA */

.card{
  width:min(90%,440px);
  min-height:420px;
  padding:38px 30px;
  position:relative;
  text-align:center;
  border-radius:30px;
  background:rgba(255,255,255,.78);
  border:1px solid rgba(255,255,255,.8);
  box-shadow:0 25px 70px rgba(180,110,130,.18);
  backdrop-filter:blur(12px);
}

.card::before{
  content:"✿";
  display:block;
  margin-bottom:15px;
  font-size:26px;
  color:#c98c9b;
}

h1,h2{
  font-weight:400;
}

h1{
  font-size:34px;
  margin:5px 0 20px;
}

h2{
  font-size:24px;
  margin:8px 0 18px;
}

p{
  font-size:17px;
  line-height:1.65;
}

input,textarea{
  width:100%;
  margin-top:14px;
  padding:13px 15px;
  border:1px solid #ead4d9;
  border-radius:14px;
  outline:none;
  background:#fffafa;
  font-family:inherit;
  font-size:16px;
  color:#49383e;
}

textarea{
  resize:none;
  min-height:110px;
}

button{
  margin-top:18px;
  padding:12px 24px;
  border:0;
  border-radius:30px;
  cursor:pointer;
  font-family:inherit;
  font-size:15px;
  color:white;
  background:#c98c9b;
  box-shadow:0 8px 20px rgba(201,140,155,.25);
  transition:.25s;
}

button:hover{
  transform:translateY(-2px);
}

.options{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:20px;
}

.options button{
  width:100%;
  margin:0;
}

.hidden{
  display:none!important;
}

.fade{
  animation:fade .45s ease;
}

.note{
  margin-top:22px;
  padding-top:18px;
  border-top:1px solid #ead4d9;
  font-size:14px;
  line-height:1.6;
  opacity:.75;
}

.instagram{
  background:#b18b9b;
}

@keyframes fade{
  from{
    opacity:0;
    transform:translateY(12px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}
</style>
</head>

<body>

<!-- FLORES -->

<div class="flower f1">🌷</div>
<div class="flower f2">🌸</div>
<div class="flower f3">🌺</div>
<div class="flower f4">🌷</div>


<main class="card">


<!-- INICIO -->

<section id="start" class="fade">

  <h1>Hola.</h1>

  <p>¿Qué haces?</p>

  <input
    id="activity"
    placeholder="Escribe lo que quieras..."
  >

  <button onclick="startConversation()">
    Enviar
  </button>

</section>


<!-- RESPUESTA -->

<section id="response" class="hidden fade">

  <h2 id="responseText"></h2>

  <p id="responseSub"></p>

  <button onclick="showMenu()">
    Continuar
  </button>

</section>


<!-- MENU -->

<section id="menu" class="hidden fade">

  <h2>Hay algunas cosas que tengo curiosidad por saber.</h2>

  <p>Elige una.</p>

  <div class="options">

    <button onclick="askAboutYou()">
      Cuéntame algo más
    </button>

    <button onclick="askSecret()">
      Dime un secreto 🤫
    </button>

    <button onclick="askAngry()">
      ¿Estás enojada?
    </button>

  </div>

</section>


<!-- PREGUNTAS -->

<section id="question" class="hidden fade">

  <h2 id="questionTitle"></h2>

  <p id="questionText"></p>

  <textarea
    id="answer"
    placeholder="Escribe aquí..."
  ></textarea>

  <button onclick="finishAnswer()">
    Continuar
  </button>

</section>


<!-- ENOJADA -->

<section id="angry" class="hidden fade">

  <h2>Pregunta seria.</h2>

  <p>¿Estás enojada?</p>

  <div class="options">

    <button onclick="finishAngry('Sí')">
      Sí
    </button>

    <button onclick="finishAngry('No')">
      No
    </button>

  </div>

</section>


<!-- FINAL -->

<section id="final" class="hidden fade">

  <h2 id="finalTitle"></h2>

  <p id="finalText"></p>

  <div class="note" id="instagramNote"></div>

  <button
    class="instagram"
    onclick="openInstagram()"
  >
    Cuéntamelo por Instagram
  </button>

  <br>

  <button onclick="showMenu()">
    Volver
  </button>

</section>


</main>


<script>

/*
  CAMBIA ESTO POR TU USUARIO.

  Ejemplo:

  const MY_INSTAGRAM="jonathan";
*/

const MY_INSTAGRAM="TU_USUARIO";


let currentQuestion="";
let currentAnswer="";
let currentType="";


/* MOSTRAR SECCIONES */

function hideAll(){

  document
    .querySelectorAll("main section")
    .forEach(section=>{
      section.classList.add("hidden");
    });

}


function show(id){

  hideAll();

  document
    .getElementById(id)
    .classList.remove("hidden");

}


/* INICIO */

function startConversation(){

  const value=document
    .getElementById("activity")
    .value
    .trim();

  if(!value)return;


  const lower=value.toLowerCase();


  if(
    lower.includes("nada") ||
    lower.includes("aburrida") ||
    lower.includes("aburrido")
  ){

    document
      .getElementById("responseText")
      .textContent="Yo también estoy aburrido.";

    document
      .getElementById("responseSub")
      .textContent="Podríamos arreglar eso.";

  }

  else{

    document
      .getElementById("responseText")
      .textContent="Me gusta saberlo.";

    document
      .getElementById("responseSub")
      .textContent=
      "Ahora tengo curiosidad por conocerte un poco más.";

  }


  show("response");

}


/* MENU */

function showMenu(){

  show("menu");

}


/* CONOCERLA */

function askAboutYou(){

  currentType="about";

  currentQuestion=
  "Si alguien quisiera conocerte de verdad, ¿qué debería saber sobre ti?";


  document
    .getElementById("questionTitle")
    .textContent="Una pregunta.";

  document
    .getElementById("questionText")
    .textContent=currentQuestion;

  document
    .getElementById("answer")
    .value="";

  show("question");

}


/* SECRETO */

function askSecret(){

  currentType="secret";

  currentQuestion="Dime un secreto.";


  document
    .getElementById("questionTitle")
    .textContent="Dime un secreto 🤫";

  document
    .getElementById("questionText")
    .textContent=
    "Algo que probablemente no le contarías a cualquiera.";

  document
    .getElementById("answer")
    .value="";

  show("question");

}


/* ENOJADA */

function askAngry(){

  currentType="angry";

  show("angry");

}


function finishAngry(value){

  currentQuestion="¿Estás enojada?";

  currentAnswer=value;


  if(value==="Sí"){

    showFinal(
      "Está bien.",
      "Entonces intentaré no molestarte demasiado."
    );

  }

  else{

    showFinal(
      "Entonces estamos bien.",
      "Eso significa que todavía puedo seguir preguntándote cosas."
    );

  }

}


/* RESPUESTA */

function finishAnswer(){

  const value=document
    .getElementById("answer")
    .value
    .trim();

  if(!value)return;


  currentAnswer=value;


  if(currentType==="about"){

    showFinal(
      "Gracias por contármelo.",
      "Creo que todavía quedan muchas cosas por descubrir sobre ti."
    );

  }


  if(currentType==="secret"){

    showFinal(
      "Ahora sé algo más de ti.",
      "Gracias por confiarme eso."
    );

  }

}


/* FINAL */

function showFinal(title,text){

  document
    .getElementById("finalTitle")
    .textContent=title;

  document
    .getElementById("finalText")
    .textContent=text;


  const note=
  document.getElementById("instagramNote");


  if(currentType==="secret"){

    note.textContent=
    "Creo que esta página todavía no es muy buena guardando secretos. Mejor cuéntamelo por Instagram.";

  }

  else{

    note.textContent=
    "Creo que esta pequeña página todavía tiene algunas cosas que aprender. Si quieres que pueda leer tu respuesta, puedes contármela por Instagram.";

  }


  show("final");

}


/* INSTAGRAM */

function openInstagram(){

  window.open(
    "https://instagram.com/"+MY_INSTAGRAM,
    "_blank"
  );

}

</script>

</body>
</html>
